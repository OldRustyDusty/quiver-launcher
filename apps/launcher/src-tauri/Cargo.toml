[package]
name = "quiver-launcher"
version = "4.0.0-alpha.1"
edition = "2021"
license = "MIT"

[lib]
name = "quiver_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma"] }
tar = "0.4"
flate2 = "1"
sevenz-rust2 = "0.15"
trash = "5"
glob = "0.3"
open = "5"
gilrs = "0.11"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
unrar = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico", "gif"] }
dirs = "6"
crc32fast = "1"
tauri-plugin-dialog = "2"
# Big Picture (fork): which processes run from a game's folder (src/bigpicture/session.rs).
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }

# Big Picture (fork): controllers through SDL3, built from source and linked in (src/bigpicture/pads.rs).
[target.'cfg(target_os = "windows")'.dependencies]
sdl3-sys = { version = "0.7.2", default-features = false, features = ["build-from-source-static", "no-sdl-audio", "no-sdl-camera", "no-sdl-gpu", "no-sdl-render", "no-sdl-dialog", "no-sdl-tray"] }

# Linux: controllers come straight from udev, so SDL is built without video (no X11 or Wayland libraries needed).
[target.'cfg(target_os = "linux")'.dependencies]
sdl3-sys = { version = "0.7.2", default-features = false, features = ["build-from-source-static", "no-sdl-audio", "no-sdl-camera", "no-sdl-gpu", "no-sdl-render", "no-sdl-dialog", "no-sdl-tray", "no-sdl-video"] }

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"

[dev-dependencies]
tempfile = "3"
